[project]
name = "agents-everywhere-sample-tool"
version = "0.1.0"
description = "Sample MCP Tool Service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0.0",
    "mcp[cli]>=1.2.0,<2.0.0",
]

[tool.agents-cli]
acli_version = "0.6.1"
agent_directory = "."
region = "us-central1"

[tool.agents-cli.create_params]
deployment_target = "cloud_run"
